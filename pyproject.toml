[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["out", "backup", ".venv"]

[tool.ruff.lint]
select = ["E4", "F", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"jobhunter/web/server.py" = ["B008"]
"jobhunter/ingest/jobapis.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
no_implicit_optional = true
warn_unused_ignores = true
exclude = "(^out/|^backup/)"

[tool.coverage.run]
source = ["jobhunter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
