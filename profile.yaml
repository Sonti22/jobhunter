# Каждый буллет — источник. Генератор может его выбрать, переставить,
# переформулировать (similarity >= 0.60 к оригиналу), выбросить. Не выдумать.

experience:
  - id: exp_linkero
    company: "Linkero"
    role_ru: "Tech Lead / Software Architect"
    role_en: "Tech Lead / Software Architect"
    start: "2025-10"
    end: null
    is_current: true
    team_size_note: "маленькая команда, единственный архитектор"
    # Дословно из резюме 28.08 (Акопян_Сурен_Python(2).pdf): проект —
    # корпоративная коммуникационная платформа на базе Matrix Synapse
    # и Element; архитектура backend/инфраструктуры, масштабирование,
    # отказоустойчивость, observability, production-readiness, hands-on.
    bullets:
      - id: b_lnk_1
        text_ru: "Прорабатывал multi-worker архитектуру Synapse: группы workers для разных типов нагрузки, маршрутизация через Nginx и независимое горизонтальное масштабирование bottleneck-компонентов."
        text_en: "Designed the multi-worker Synapse architecture: worker groups per load type, routing through Nginx, and independent horizontal scaling of bottleneck components."
        skills: [matrix, nginx, microservices, python]
        metrics: []
      - id: b_lnk_2
        text_ru: "Проектировал topology PostgreSQL + Redis, сценарии деградации и поведение workers при отказе критических зависимостей."
        text_en: "Designed the PostgreSQL + Redis topology, degradation scenarios, and worker behaviour on failure of critical dependencies."
        skills: [postgresql, redis, microservices]
        metrics: []
      - id: b_lnk_3
        text_ru: "Закладывал bounded queues и backpressure, чтобы при всплесках нагрузки очереди не росли бесконтрольно до OOM."
        text_en: "Built in bounded queues and backpressure so that load spikes could not grow queues uncontrollably into OOM."
        skills: [microservices, profiling]
        metrics: []
      - id: b_lnk_4
        text_ru: "Реализовывал fail-fast / no silent degradation: health/degraded состояния, 503 при невозможности безопасно обслуживать запросы и понятные сигналы для балансировщика и мониторинга."
        text_en: "Implemented fail-fast / no-silent-degradation: health/degraded states, 503 when requests cannot be served safely, and clear signals for the load balancer and monitoring."
        skills: [nginx, prometheus, microservices]
        # 503 — HTTP-статус из текста буллета; без метрики гейт чисел режет его
        # как неподтверждённое число.
        metrics: [{value: "503", unit: "http_status"}]
      - id: b_lnk_5
