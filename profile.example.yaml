# ── faq: ваши готовые ответы на типовые вопросы рекрутёров ───────────────────
# Бот отвечает ими ДОСЛОВНО, без нейросети. Вопрос, которого тут нет, уходит
# вам карточкой в бот-пульт. id известных тем: about_me, last_project,
# location_and_format, start_date, salary, payments_experience.
faq:
- id: about_me
  answer_ru: 'Backend-разработчик на Python, больше шести лет в коммерческой разработке; последний год — Tech Lead
    / архитектор интеграционной платформы в Nordlane, веду команду. Проектирую отказоустойчивые распределённые системы:
    интеграции с внешними API, очереди с backpressure, идемпотентная обработка, observability. Стек: Python, FastAPI,
    Django, PostgreSQL, ClickHouse, Redis, Kafka, RabbitMQ, Docker, Kubernetes. Живу в Москве; удалённо, гибрид
    или офис в Москве; английский C2, могу выйти сразу.'
  answer_en: 'Python backend engineer with more than six years of commercial experience; for the last year Tech
    Lead and software architect of an integration platform at Nordlane, leading the team. I design fault-tolerant
    distributed systems: external API integrations, queues with backpressure, idempotent processing, observability.
    Stack: Python, FastAPI, Django, PostgreSQL, ClickHouse, Redis, Kafka, RabbitMQ, Docker, Kubernetes. Based in
    Moscow, working remotely (not relocating), English C2, available immediately.'
- id: last_project
  answer_ru: 'Последний проект — Integration Manager в Nordlane: единая точка подключения внешних сервисов к платформе
    (FastAPI + React): реестр интеграций, права доступа, allow/deny-политики и проверка безопасности. Подключение
    новой интеграции сократилось с пяти дней до одного. Там же ввёл стандарт внешних вызовов — таймауты, ретраи
    с backoff, идемпотентность, backpressure; после этого инциденты с переполнением очередей прекратились. События
    и метрики — в ClickHouse, наблюдаемость — Prometheus и Grafana, прод — Kubernetes и GitLab CI.'
  answer_en: 'My latest project is the Integration Manager at Nordlane: a single entry point for connecting external
    services to the platform (FastAPI + React) — an integration registry, permissions, allow/deny policies and security
    validation. Onboarding a new integration went from five days to one. I also introduced a standard for external
    calls — timeouts, retries with backoff, idempotency, backpressure — after which queue-overflow incidents stopped.
    Events and metrics live in ClickHouse, observability is Prometheus and Grafana, production runs on Kubernetes
    with GitLab CI.'
- id: location_and_format
  answer_ru: Живу в Москве. Подходит удалённый формат, гибрид или офис в Москве. К переезду не готов, командировки
    возможны. Могу выйти сразу.
  answer_en: I'm based in Moscow and work remotely; I'm not relocating, but business trips are fine. I can start
    immediately.
- id: start_date
  answer_ru: Могу выйти сразу.
  answer_en: I can start immediately.
- id: salary
  answer_ru: Ожидания хочу сверить с вилкой позиции — подскажете, какой бюджет предусмотрен?
