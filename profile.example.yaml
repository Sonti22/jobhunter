# ── outreach: что бот пишет о вас от первого лица ────────────────────────────
# Тема письма, вступления, строка о формате работы, ответы «где вы и как
# готовы работать». Числа и технологии здесь тоже проверяет гейт правды.
#   subject_direct_* — письмо человеку; {about} = «роль в компании»
#   subject_apply_*  — отклик в форму; {role} = роль
#   intros_*         — вступления для Senior-вакансий; intros_short_* —
#                      если письмо не влезает в 400 знаков; intros_middle_* —
#                      для Middle-вакансий (без стажа и «Tech Lead»)
#   interest_*       — письмо компании без открытой роли; {company} = компания
#   format_line_*    — строка о формате в КАЖДОМ письме
#   letter_tail_*    — последняя строка прямого письма
#   format_rule_llm_* — формат своими словами для нейросети
#   format_replies_* — ответ на «где вы / готовы ли к офису?»
#   office_city_patterns — где подходит офис/гибрид (регулярные выражения)
#   never_say        — слова, которых не должно быть в автоответах
#   cv_file_prefix   — начало имени файла резюме: Smirnov_Python_ab12.pdf
